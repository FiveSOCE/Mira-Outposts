name: MiraOutposts
version: 0.2.1
main: gg.mira.outposts.MiraOutpostsPlugin
api-version: '1.21'
author: FiveSOCE
description: FAWE-defined scheduled faction capture events with GUI administration and live boss bars.
depend: [MiraCore, MiraFactions, FastAsyncWorldEdit]
softdepend: [MiraBoosters]
commands:
  outpost:
    description: Open and manage MiraOutposts
    usage: /outpost [gui|info <id>|start <id>|stop <id>]
    permission: miraoutposts.use
permissions:
  miraoutposts.use:
    default: true
  miraoutposts.admin:
    default: op
