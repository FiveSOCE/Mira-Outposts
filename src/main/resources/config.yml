capture:
  reset-when-empty: true
  reset-when-contested: true

defaults:
  capture-seconds: 30
  channel: spawner_rate
  multiplier: 1.25

creation:
  max-area-blocks: 262144
  max-side-length: 512
  max-capture-seconds: 3600
  max-multiplier: 100.0

schedule:
  # Automatic runs stop after this many minutes unless changed per outpost in the GUI.
  default-run-minutes: 30

api:
  max-effective-multiplier: 1000.0

boosters:
  combine-in-player-multiplier: true

# Optional strategic rotation. Only IDs listed here are controlled by the rotation.
# Individual per-outpost schedules are ignored for rotation-controlled outposts.
rotation:
  enabled: false
  interval-minutes: 180
  active-count: 2
  random-order: false
  outposts: []

# Capture-time functional hooks. The ongoing held reward remains the outpost channel/multiplier.
# Commands run once when ownership changes and support:
# %outpost%, %faction%, %faction_id%, %previous_owner%
rewards:
  capture-commands:
    default: []
    outposts: {}
