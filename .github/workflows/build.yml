name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MiraOutposts-0.2.3
          path: build/libs/MiraOutposts-0.2.3.jar
          if-no-files-found: error

      - name: Publish v0.2.3 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.3 >/dev/null 2>&1; then
            gh release create v0.2.3 \
              build/libs/MiraOutposts-0.2.3.jar \
              --target "${{ github.sha }}" \
              --title "MiraOutposts v0.2.3" \
              --notes "Adds MiraCosmetics audio hooks for Outpost activation, capture start, contested warnings/pulses, capture completion and shutdown while preserving existing capture visuals."
          fi
