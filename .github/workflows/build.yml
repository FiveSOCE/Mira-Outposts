name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MiraOutposts-0.2.5
          path: build/libs/MiraOutposts-0.2.5.jar
          if-no-files-found: error

      - name: Publish v0.2.5 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.5 >/dev/null 2>&1; then
            gh release create v0.2.5 \
              build/libs/MiraOutposts-0.2.5.jar \
              --target "${{ github.sha }}" \
              --title "MiraOutposts v0.2.5" \
              --notes "Corrects Outpost sound audiences: start, contested/pulse and captured are global; capture start targets the capturing faction; stop targets the current owner faction; captured visuals remain local while audio is global."
          fi
